name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a PR obsoletes the
# in-flight run). main pushes are keyed by SHA so they never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: zig fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true

      - name: zig fmt --check
        run: zig fmt --check src

      # The minWordCount table in src/spirv_cross_common.zig is generated from
      # the vendored Khronos grammar. A hand edit inside the BEGIN/END GENERATED
      # block can only make the table wrong, and an over-strict entry silently
      # rejects spec-valid SPIR-V, so drift is a gate. Reads the vendored
      # tools/spirv.core.grammar.json, no network. python3 is preinstalled on
      # ubuntu-latest.
      - name: minWordCount table is not hand-edited
        run: python3 tools/gen_min_word_count.py --check src/spirv_cross_common.zig

      # `zioshade --version` prints src/version.zig, but the tag a release is
      # cut from is build.zig.zon's .version. The zon is not importable, so the
      # pair can only be kept honest by checking; drift means a shipped binary
      # reports a version it was not. Offline: no network.
      - name: version strings are in sync
        run: python3 tools/check_version_sync.py

  build-test:
    name: build & test (${{ matrix.os }}, zig ${{ matrix.zig }})
    strategy:
      fail-fast: false
      matrix:
        # 0.15.2 is the hard floor, tested on Linux and Windows. macOS is
        # deliberately absent from the 0.15.2 row: Zig 0.15.2 cannot link
        # libSystem against the macOS 15/26 SDKs the current runner images ship
        # (every libc symbol comes back undefined, led by
        # __availability_version_check), and the one image with an old-enough SDK
        # (macos-13) has effectively no runners available. macOS is instead
        # covered on 0.16 below, whose macho linker handles the modern SDK.
        os: [ubuntu-latest, windows-latest]
        zig: ["0.15.2"]
        include:
          # 0.16 is a required check: the library, CLI, C ABI, and full test
          # suite build and pass on it (the std.Io / process-API divergence is
          # centralized in src/compat.zig). Runs on Linux and, as the macOS
          # coverage, macos-latest. The only 0.16 holdout is the standalone dev
          # tools under tools/ (not built by these steps), tracked in #424.
          - os: ubuntu-latest
            zig: "0.16.0"
          - os: macos-latest
            zig: "0.16.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Install the oracle validators so the differential tests (wgsl_tests via
      # glslang, correctness_tests via spirv-val) actually run instead of taking
      # their tool-absent SkipZigTest path. Linux only: apt has both; the other
      # OSes keep skipping (spirv-val is covered separately by the conformance
      # job) so we avoid the heavier per-OS SDK installs here.
      - name: Install oracle validators (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      # tests/wgsl_tests.zig gates 224 assertions behind nagaValidateOrSkip, which
      # takes its SkipZigTest path when naga is absent, so without this step the
      # WGSL oracle never ran in the job that runs the Zig test suite. Same pinned
      # version as the spv-validity and cts-ingestion jobs. Linux only: naga has no
      # prebuilt binary and Rust is preinstalled on ubuntu-latest.
      - name: Install naga (WGSL oracle)
        if: runner.os == 'Linux'
        run: cargo install naga-cli --version 30.0.0

      - name: Install Zig ${{ matrix.zig }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          use-cache: true

      - name: zig version
        run: zig version

      - name: Build (library + CLI)
        run: |
          zig build
          zig build cli

      - name: Build examples
        run: zig build examples

      - name: Unit tests
        run: zig build test --summary all

      - name: HLSL backend tests
        run: zig build test-hlsl --summary all

  conformance:
    name: spirv-val conformance (${{ matrix.os }})
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # The Windows leg installs the Vulkan SDK (for spirv-val), and that
          # makes the post-step @actions/cache save fall back from the system
          # bsdtar to its pure-JS tar, which recurses over the ~1.3GB .zig-cache
          # tree and overflows the V8 stack ("Maximum call stack size exceeded")
          # -- failing the whole job even though the conformance suite passed.
          # The cache only ever shortens a cold compile, so skip it on Windows.
          use-cache: ${{ runner.os != 'Windows' }}

      # spirv-val is all the conformance suite needs. The distro spirv-tools
      # package ships it, so we skip the full LunarG Vulkan SDK (whose apt repo
      # is only published for older Ubuntu codenames and 404s on newer runners).
      - name: Install spirv-tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.1
          cache: true

      - name: Verify spirv-val on PATH
        shell: bash
        run: spirv-val --version

      - name: Run conformance suite
        run: zig build conformance --summary all

      # The strict gate (no curated-valid fixture may be rejected by the
      # fail-loud API) is a merge invariant in CONTRIBUTING and the README
      # badge, so it runs here rather than only on a maintainer's machine.
      # --min-pass pins the current corpus size: without it a renamed fixture
      # directory or a walker regression would report a green gate over an
      # empty run. Bump the floor in the same commit that adds fixtures.
      - name: Strict gate (no false-positive rejections)
        # bash on every leg: this is the only step in the workflow that passes
        # `-- <args>` through to the build step, and the Windows leg would
        # otherwise run it under pwsh, which eats a bare `--`.
        shell: bash
        run: zig build strict-gate --summary all -- --min-pass=2108

  # Arbitrary-SPIR-V backend validity sweep (e54.4.4). Feeds EXTERNAL .spv binaries
  # (not GLSL source) straight through the backends and compile-checks each emitted
  # backend source with its ecosystem reference compiler. GLSL is the COMPLETE oracle
  # (glslangValidator accepts/rejects definitively); WGSL via naga is a CANDIDATE
  # oracle. MSL (Metal) and HLSL (DXC) are environmental and skip GRACEFULLY on Linux by
  # design -- the sweep never false-fails on a missing optional oracle -- so they get
  # their own runners in the msl-validity (macOS) and hlsl-validity (Windows) jobs.
  # Guards the e54.4 + S1 fixes (PRs #506-519) against silent regression on arbitrary
  # SPIR-V, the exact plausible-but-wrong class this project exists to prevent.
  # INVALID is 0 as of eee5886; this job turns that into a non-regression gate.
  spv-validity:
    name: arbitrary-SPIR-V validity (GLSL + WGSL)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true

      - name: Install oracle validators
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools spirv-cross

      # naga has no prebuilt binary; cargo compiles it (Rust is preinstalled on
      # ubuntu-latest). Pinned to 30.0.0 -- the version the corpus is green against --
      # so an upstream naga WGSL-validation change can't false-red this gate.
      - name: Install naga (WGSL oracle)
        run: cargo install naga-cli --version 30.0.0

      - name: Build CLI
        run: zig build cli

      - name: Run arbitrary-SPIR-V validity sweep
        run: bash tools/spv_input_validity_sweep.sh tests/arbitrary_spirv

  # CTS ingestion credibility sweep (r2d.2). Broad-corpus counterpart of the gating
  # spv-validity job: feeds the vendored GraphicsFuzz corpus (SPIRV-Tools' fuzz seeds,
  # committed at tests/cts/graphicsfuzz) through the binary-ingestion path and reports
  # per-backend ok / invalid-output / honest-error / CRASH. NON-GATING on invalid-output
  # (expected breadth); GATES on a NEW crash (count > tests/cts/baseline.txt) -- a crash
  # on valid input is a mandate violation. GLSL complete-oracle (glslang) + WGSL candidate
  # (naga 30.0.0). MSL and HLSL skip gracefully here (no Metal, no DXC on this runner);
  # their rows in the baseline are enforced by the msl-validity / hlsl-validity jobs.
  cts-ingestion:
    name: CTS ingestion credibility (GLSL + WGSL)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true

      - name: Install oracle validators
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Install naga (WGSL oracle)
        run: cargo install naga-cli --version 30.0.0

      - name: Build CLI
        run: zig build cli

      - name: Run CTS ingestion sweep
        run: bash tools/cts_ingestion_sweep.sh tests/cts/graphicsfuzz

  # Structural-drop gate (PR #588 sweep, gated once #589 + #590 closed the class). The
  # worst silent-wrong this compiler can make: a loop or switch present in the SPIR-V is
  # missing from the emitted source, the output still compiles, and no validity gate sees
  # it. Three independent signals (cross-backend strictly-below-all-peers, SPIR-V floor
  # after subtracting provably single-iteration loops, WGSL nested-selection breaks) are
  # 0/0/0/0 across MSL/GLSL/HLSL/WGSL over both corpora after #589 (GLSL Pattern-B loop
  # nested in a selection arm) and #590 (HLSL self-loop nested in a selection arm); this
  # job turns that into a non-regression gate so the class cannot silently return. Exits
  # non-zero on any drop. Runs over BOTH corpora (spirv-cross + CTS GraphicsFuzz); the CTS
  # .spv leg needs spirv-dis (spirv-tools) for the SPIR-V floor. Ubuntu only -- the result
  # is OS-independent (pure zioshade backend logic + spirv-dis), matching cts-ingestion.
  structural-drop:
    name: structural-drop (no loop/switch dropped)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true

      - name: Install spirv-tools (spirv-dis for the SPIR-V floor)
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Verify spirv-dis on PATH
        run: spirv-dis --version

      - name: Build CLI
        run: zig build cli

      - name: Run structural-drop sweep (both corpora, all backends)
        run: python3 tools/structural_drop_sweep.py --corpus both --backends msl,glsl,hlsl,wgsl

      # Unreachable-statement gate. A statement after a statement-level break/continue/
      # return/discard in the same block was silently dropped from the program; the output
      # still compiles, so no validity gate sees it, and structural-drop does not either
      # (it counts loops and switches, not reachability). This detector found #599 (WGSL
      # emitted a second unconditional break, orphaning 36 shaders' loop bodies) and #604
      # (a selection merge read as a trampoline, leaving graphicsfuzz_061's loop with no
      # exit). Clean at 0/0/0/0 across both corpora since #612 and #614; gate it so the
      # class cannot come back. Shares this job because the CLI is already built.
      - name: Run unreachable-statement scan (both corpora, all backends)
        run: |
          for be in msl glsl hlsl wgsl; do
            python3 tools/unreachable_scan.py zig-out/bin/zioshade "$be" \
              tests/spirv-cross/*.frag tests/cts/graphicsfuzz/*.spv
          done

  # MSL leg of the two SPIR-V-input sweeps, on a real Metal compiler. The Linux jobs
  # above skip MSL and HLSL (no Metal, no DXC), so until this job and hlsl-validity
  # existed, the two backends wintty actually links -- MSL on macOS, HLSL on Windows --
  # had NO CI-enforced gate on arbitrary SPIR-V input: a contributor could regress their
  # crash behaviour and CI stayed green.
  #
  # Zig 0.16 (not 0.15.2) for the same reason as build-test's macOS row: 0.15.2 cannot
  # link libSystem against the SDK the current macOS runner image ships.
  #
  # COMPILE-validation only: does the Metal compiler accept what zioshade emitted.
  # Render-differential (same pixels) needs a GPU and stays a local gate (`just prove`,
  # `just prove-naga`, tools/*_render_check.sh) -- hosted runners have no usable GPU.
  msl-validity:
    name: MSL validity + CTS ingestion (macOS)
    needs: build-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: true

      # glslangValidator + spirv-dis/spirv-val (stage detection, input validity) +
      # spirv-cross (the MSL discriminator: zioshade-invalid is only a REAL bug if
      # spirv-cross's MSL for the same module compiles). naga is deliberately not
      # installed -- WGSL is already gated on Linux and building it here would add a
      # Rust compile to every run for no new signal.
      - name: Install oracle validators
        run: brew install glslang spirv-tools spirv-cross

      # Fail HERE, loudly, if the runner has no usable Metal compiler, rather than
      # letting the sweeps take their graceful-skip path and report a green MSL gate
      # that never ran. The probe compiles a trivial known-good .metal file.
      - name: Verify the Metal oracle actually compiles MSL
        run: bash tools/msl_compile_check.sh --probe

      - name: Build CLI
        run: zig build cli

      - name: Run arbitrary-SPIR-V validity sweep (MSL leg live)
        run: bash tools/spv_input_validity_sweep.sh tests/arbitrary_spirv

      - name: Run CTS ingestion sweep (MSL crash gate live)
        run: bash tools/cts_ingestion_sweep.sh tests/cts/graphicsfuzz

  # HLSL leg of the two SPIR-V-input sweeps, on a real DXC. The Windows Vulkan SDK ships
  # dxc.exe (plus glslangValidator, spirv-dis/val and spirv-cross), so this mirrors how
  # the conformance job gets spirv-val rather than standing up the dxc-oracle container
  # that macOS/Linux developers use. Same scope as msl-validity: compile-validation only.
  hlsl-validity:
    name: HLSL validity + CTS ingestion (Windows)
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # Same @actions/cache overflow as the Windows conformance leg: with the
          # Vulkan SDK installed, the post-step cache save falls back to a pure-JS tar
          # and blows the V8 stack on the .zig-cache tree, failing a job whose sweeps
          # passed. The cache only ever shortens a cold compile.
          use-cache: false

      - name: Install Vulkan SDK (ships DXC + glslang + SPIRV-Tools + SPIRV-Cross)
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.1
          cache: true

      # Loud, explicit toolchain check: every one of these is a hard requirement of the
      # sweeps, and a missing one must read as "this runner lacks the oracle", never as
      # a shader-correctness failure. `spirv-cross --version` exits non-zero (it prints
      # usage), so its presence is checked with command -v instead.
      - name: Verify the HLSL oracle toolchain
        shell: bash
        run: |
          set -euo pipefail
          dxc --version
          glslangValidator --version
          spirv-dis --version
          spirv-val --version
          command -v spirv-cross
          bash tools/hlsl_compile_check.sh --probe

      - name: Build CLI
        run: zig build cli

      - name: Run arbitrary-SPIR-V validity sweep (HLSL leg live)
        shell: bash
        run: bash tools/spv_input_validity_sweep.sh tests/arbitrary_spirv

      - name: Run CTS ingestion sweep (HLSL crash gate live)
        shell: bash
        run: bash tools/cts_ingestion_sweep.sh tests/cts/graphicsfuzz

  fuzz-smoke:
    name: fuzz smoke (5k iterations)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true
      - name: Quick fuzz pass
        run: zig build fuzz -- --count 5000

  # Smoke-tests the public C ABI surface across all three OSes by building the
  # static + shared libraries and running the C consumer example end-to-end.
  # Kept separate from build-test so a C-side regression doesn't mask Zig test
  # failures (and vice versa).
  c-abi:
    name: C ABI smoke
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        # Same toolchain split as build-test: 0.15.2 on Linux and Windows, and
        # macOS on 0.16 (Zig 0.15.2 cannot link the modern macOS SDK, and the
        # old-SDK macos-13 image has no runners available).
        include:
          - os: ubuntu-latest
            zig: "0.15.2"
          - os: windows-latest
            zig: "0.15.2"
          - os: macos-latest
            zig: "0.16.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          use-cache: true
      - name: Build C ABI library and example
        run: |
          zig build c-lib --summary all
          zig build c-example --summary all
      - name: Run C consumer
        run: zig build run-c-example

  # Builds the C ABI and the C consumer example from a tree that contains ONLY
  # the entries listed in build.zig.zon's .paths, which is exactly what a
  # `zig fetch` consumer sees. Every other job starts from a full checkout, so a
  # build step that reads a top-level directory missing from .paths (include/
  # was, until this job existed) would only fail in a downstream project.
  # c-lib covers include/, c-example covers examples/. Linux alone is enough:
  # this validates packaging, not platform support.
  package-smoke:
    name: package smoke (.paths only)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true
      - name: Assemble a .paths-only copy of the tree
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/pkg"
          rm -rf "$dest"
          mkdir -p "$dest"
          # Parsed with python3 rather than awk: the brace-range form is not
          # portable across the awk implementations a runner image may ship.
          python3 - build.zig.zon > "${RUNNER_TEMP}/paths.txt" <<'PY'
          import re, sys

          src = open(sys.argv[1], encoding="utf-8").read()
          block = re.search(r"\.paths\s*=\s*\.\{(.*?)\}", src, re.S)
          if block is None:
              sys.exit("could not find a .paths block in build.zig.zon")
          entries = re.findall(r'"([^"]+)"', block.group(1))
          if not entries:
              sys.exit(".paths block in build.zig.zon is empty")
          print("\n".join(entries))
          PY
          mapfile -t paths < "${RUNNER_TEMP}/paths.txt"
          for p in "${paths[@]}"; do
            echo "packaging $p"
            cp -R "$p" "$dest/$p"
          done
          ls -la "$dest"
      - name: Build c-lib from the packaged form
        working-directory: ${{ runner.temp }}/pkg
        run: zig build c-lib --summary all
      - name: Assert the C header was installed
        run: test -f "${RUNNER_TEMP}/pkg/zig-out/include/zioshade.h"
      - name: Build the C consumer example from the packaged form
        working-directory: ${{ runner.temp }}/pkg
        run: zig build c-example --summary all
