name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a PR obsoletes the
# in-flight run). main pushes are keyed by SHA so they never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: zig fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true

      - name: zig fmt --check
        run: zig fmt --check src

  build-test:
    name: build & test (${{ matrix.os }}, zig ${{ matrix.zig }})
    strategy:
      fail-fast: false
      matrix:
        # 0.15.2 is the hard floor, tested on Linux and Windows. macOS is
        # deliberately absent from the 0.15.2 row: Zig 0.15.2 cannot link
        # libSystem against the macOS 15/26 SDKs the current runner images ship
        # (every libc symbol comes back undefined, led by
        # __availability_version_check), and the one image with an old-enough SDK
        # (macos-13) has effectively no runners available. macOS is instead
        # covered on 0.16 below, whose macho linker handles the modern SDK.
        os: [ubuntu-latest, windows-latest]
        zig: ["0.15.2"]
        include:
          # 0.16 is a required check: the library, CLI, C ABI, and full test
          # suite build and pass on it (the std.Io / process-API divergence is
          # centralized in src/compat.zig). Runs on Linux and, as the macOS
          # coverage, macos-latest. The only 0.16 holdout is the standalone dev
          # tools under tools/ (not built by these steps), tracked in #424.
          - os: ubuntu-latest
            zig: "0.16.0"
          - os: macos-latest
            zig: "0.16.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Install the oracle validators so the differential tests (wgsl_tests via
      # glslang, correctness_tests via spirv-val) actually run instead of taking
      # their tool-absent SkipZigTest path. Linux only: apt has both; the other
      # OSes keep skipping (spirv-val is covered separately by the conformance
      # job) so we avoid the heavier per-OS SDK installs here.
      - name: Install oracle validators (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      # tests/wgsl_tests.zig gates 224 assertions behind nagaValidateOrSkip, which
      # takes its SkipZigTest path when naga is absent, so without this step the
      # WGSL oracle never ran in the job that runs the Zig test suite. Same pinned
      # version as the spv-validity and cts-ingestion jobs. Linux only: naga has no
      # prebuilt binary and Rust is preinstalled on ubuntu-latest.
      - name: Install naga (WGSL oracle)
        if: runner.os == 'Linux'
        run: cargo install naga-cli --version 30.0.0

      - name: Install Zig ${{ matrix.zig }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          use-cache: true

      - name: zig version
        run: zig version

      - name: Build (library + CLI)
        run: |
          zig build
          zig build cli

      - name: Build examples
        run: zig build examples

      - name: Unit tests
        run: zig build test --summary all

      - name: HLSL backend tests
        run: zig build test-hlsl --summary all

  conformance:
    name: spirv-val conformance (${{ matrix.os }})
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # The Windows leg installs the Vulkan SDK (for spirv-val), and that
          # makes the post-step @actions/cache save fall back from the system
          # bsdtar to its pure-JS tar, which recurses over the ~1.3GB .zig-cache
          # tree and overflows the V8 stack ("Maximum call stack size exceeded")
          # -- failing the whole job even though the conformance suite passed.
          # The cache only ever shortens a cold compile, so skip it on Windows.
          use-cache: ${{ runner.os != 'Windows' }}

      # spirv-val is all the conformance suite needs. The distro spirv-tools
      # package ships it, so we skip the full LunarG Vulkan SDK (whose apt repo
      # is only published for older Ubuntu codenames and 404s on newer runners).
      - name: Install spirv-tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.1
          cache: true

      - name: Verify spirv-val on PATH
        shell: bash
        run: spirv-val --version

      - name: Run conformance suite
        run: zig build conformance --summary all

      # The strict gate (no curated-valid fixture may be rejected by the
      # fail-loud API) is a merge invariant in CONTRIBUTING and the README
      # badge, so it runs here rather than only on a maintainer's machine.
      # --min-pass pins the current corpus size: without it a renamed fixture
      # directory or a walker regression would report a green gate over an
      # empty run. Bump the floor in the same commit that adds fixtures.
      - name: Strict gate (no false-positive rejections)
        # bash on every leg: this is the only step in the workflow that passes
        # `-- <args>` through to the build step, and the Windows leg would
        # otherwise run it under pwsh, which eats a bare `--`.
        shell: bash
        run: zig build strict-gate --summary all -- --min-pass=2108

  # Arbitrary-SPIR-V backend validity sweep (e54.4.4). Feeds EXTERNAL .spv binaries
  # (not GLSL source) straight through the backends and compile-checks each emitted
  # backend source with its ecosystem reference compiler. GLSL is the COMPLETE oracle
  # (glslangValidator accepts/rejects definitively); WGSL via naga is a CANDIDATE
  # oracle. MSL (Metal) and HLSL (DXC container) are environmental and skip GRACEFULLY
  # on Linux by design -- the sweep never false-fails on a missing optional oracle.
  # Guards the e54.4 + S1 fixes (PRs #506-519) against silent regression on arbitrary
  # SPIR-V, the exact plausible-but-wrong class this project exists to prevent.
  # INVALID is 0 as of eee5886; this job turns that into a non-regression gate.
  spv-validity:
    name: arbitrary-SPIR-V validity (GLSL + WGSL)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true

      - name: Install oracle validators
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools spirv-cross

      # naga has no prebuilt binary; cargo compiles it (Rust is preinstalled on
      # ubuntu-latest). Pinned to 30.0.0 -- the version the corpus is green against --
      # so an upstream naga WGSL-validation change can't false-red this gate.
      - name: Install naga (WGSL oracle)
        run: cargo install naga-cli --version 30.0.0

      - name: Build CLI
        run: zig build cli

      - name: Run arbitrary-SPIR-V validity sweep
        run: bash tools/spv_input_validity_sweep.sh tests/arbitrary_spirv

  # CTS ingestion credibility sweep (r2d.2). Broad-corpus counterpart of the gating
  # spv-validity job: feeds the vendored GraphicsFuzz corpus (SPIRV-Tools' fuzz seeds,
  # committed at tests/cts/graphicsfuzz) through the binary-ingestion path and reports
  # per-backend ok / invalid-output / honest-error / CRASH. NON-GATING on invalid-output
  # (expected breadth); GATES on a NEW crash (count > tests/cts/baseline.txt) -- a crash
  # on valid input is a mandate violation. GLSL complete-oracle (glslang) + WGSL candidate
  # (naga 30.0.0); MSL/HLSL skip gracefully.
  cts-ingestion:
    name: CTS ingestion credibility (GLSL + WGSL)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true

      - name: Install oracle validators
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Install naga (WGSL oracle)
        run: cargo install naga-cli --version 30.0.0

      - name: Build CLI
        run: zig build cli

      - name: Run CTS ingestion sweep
        run: bash tools/cts_ingestion_sweep.sh tests/cts/graphicsfuzz

  fuzz-smoke:
    name: fuzz smoke (5k iterations)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true
      - name: Quick fuzz pass
        run: zig build fuzz -- --count 5000

  # Smoke-tests the public C ABI surface across all three OSes by building the
  # static + shared libraries and running the C consumer example end-to-end.
  # Kept separate from build-test so a C-side regression doesn't mask Zig test
  # failures (and vice versa).
  c-abi:
    name: C ABI smoke
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        # Same toolchain split as build-test: 0.15.2 on Linux and Windows, and
        # macOS on 0.16 (Zig 0.15.2 cannot link the modern macOS SDK, and the
        # old-SDK macos-13 image has no runners available).
        include:
          - os: ubuntu-latest
            zig: "0.15.2"
          - os: windows-latest
            zig: "0.15.2"
          - os: macos-latest
            zig: "0.16.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          use-cache: true
      - name: Build C ABI library and example
        run: |
          zig build c-lib --summary all
          zig build c-example --summary all
      - name: Run C consumer
        run: zig build run-c-example

  # Builds the C ABI and the C consumer example from a tree that contains ONLY
  # the entries listed in build.zig.zon's .paths, which is exactly what a
  # `zig fetch` consumer sees. Every other job starts from a full checkout, so a
  # build step that reads a top-level directory missing from .paths (include/
  # was, until this job existed) would only fail in a downstream project.
  # c-lib covers include/, c-example covers examples/. Linux alone is enough:
  # this validates packaging, not platform support.
  package-smoke:
    name: package smoke (.paths only)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true
      - name: Assemble a .paths-only copy of the tree
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/pkg"
          rm -rf "$dest"
          mkdir -p "$dest"
          # Parsed with python3 rather than awk: the brace-range form is not
          # portable across the awk implementations a runner image may ship.
          python3 - build.zig.zon > "${RUNNER_TEMP}/paths.txt" <<'PY'
          import re, sys

          src = open(sys.argv[1], encoding="utf-8").read()
          block = re.search(r"\.paths\s*=\s*\.\{(.*?)\}", src, re.S)
          if block is None:
              sys.exit("could not find a .paths block in build.zig.zon")
          entries = re.findall(r'"([^"]+)"', block.group(1))
          if not entries:
              sys.exit(".paths block in build.zig.zon is empty")
          print("\n".join(entries))
          PY
          mapfile -t paths < "${RUNNER_TEMP}/paths.txt"
          for p in "${paths[@]}"; do
            echo "packaging $p"
            cp -R "$p" "$dest/$p"
          done
          ls -la "$dest"
      - name: Build c-lib from the packaged form
        working-directory: ${{ runner.temp }}/pkg
        run: zig build c-lib --summary all
      - name: Assert the C header was installed
        run: test -f "${RUNNER_TEMP}/pkg/zig-out/include/zioshade.h"
      - name: Build the C consumer example from the packaged form
        working-directory: ${{ runner.temp }}/pkg
        run: zig build c-example --summary all
